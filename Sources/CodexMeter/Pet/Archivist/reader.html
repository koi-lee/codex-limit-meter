<main id="browser-guide" hidden>
  <h1>请在 Codex Meter App 中体验桌宠</h1>
  <p>这是 App 内部的动画渲染文件，需要由 App 加载。它不是独立网页体验入口。</p>
  <p>打开“应用程序”中的 <strong>Codex Meter</strong>，在状态栏菜单选择“星夜档案员 → 星辰 · 男生”。点击桌面的男生即可展开额度、消息和变化星盘。</p>
  <p>如果你在网页上看到悬浮人物，那是正在运行的桌宠窗口，不是网页内容。</p>
